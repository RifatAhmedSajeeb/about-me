<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --secondary: #ec4899;
      --accent: #06b6d4;
      --bg: #030712;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Dynamic Background Lights */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      animation: float 10s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 350px;
      height: 350px;
      background: var(--primary);
      top: -10%;
      left: 20%;
    }
    .orb-2 {
      width: 400px;
      height: 400px;
      background: var(--secondary);
      bottom: -10%;
      right: 20%;
      animation-delay: -5s;
    }

    /* Glass Card Container */
    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 440px;
      background: rgba(17, 24, 39, 0.45);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5),
                  0 18px 36px -18px rgba(0, 0, 0, 0.7),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
    }

    /* Status Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d1d5db;
      margin-bottom: 1.5rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #9ca3af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 0.925rem;
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Glowing Circular Countdown */
    .timer-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-wrapper svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 6;
    }

    .timer-progress {
      fill: none;
      stroke: url(#glow-gradient);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 408;
      stroke-dashoffset: 0;
      animation: drain 5s linear forwards;
    }

    #count {
      position: absolute;
      font-size: 3.25rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 30%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Glowing Interactive Button */
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary) 0%, #6d28d9 100%);
      border: none;
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(139, 92, 246, 0.6);
      background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Keyframes */
    @keyframes drain {
      to { stroke-dashoffset: 408; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -30px) scale(1.1); }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <div class="badge">
      <span class="badge-dot"></span> Redirecting System
    </div>

    <h1>Connecting You Now</h1>
    <p>Please wait while we establish a secure connection to your target page.</p>

    <div class="timer-wrapper">
      <svg viewBox="0 0 140 140">
        <defs>
          <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ec4899" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
        </defs>
        <circle class="timer-bg" cx="70" cy="70" r="65"></circle>
        <circle class="timer-progress" cx="70" cy="70" r="65"></circle>
      </svg>
      <span id="count">5</span>
    </div>

    <a id="destination-btn" href="#" class="btn">Proceed Right Now</a>
  </div>

  <script>
    // Set your target URL here
    const destination = "#";
    let seconds = 5;

    const countDisplay = document.getElementById('count');
    const destinationBtn = document.getElementById('destination-btn');

    // Ensure link fallback is set instantly
    destinationBtn.href = destination;

    const timer = setInterval(() => {
      seconds--;
      if (seconds >= 0) {
        countDisplay.textContent = seconds;
      }

      if (seconds <= 0) {
        clearInterval(timer);
        // Direct location change attempt
        try {
          window.location.assign(destination);
        } catch (e) {
          window.location.href = destination;
        }
      }
    }, 1000);
  </script>

</body>
</html>
